<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NanoLab — Queued Samples</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden" x-data="app()">

  <!-- TOPBAR -->
  <header class="h-14 bg-white border-t-[3px] border-t-indigo-600 border-b border-b-gray-200 flex items-center px-5 shrink-0 z-10">
    <div class="flex items-center gap-2.5 w-52 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8" />
        </svg>
      </div>
      <div class="flex items-baseline gap-1.5">
        <span class="font-bold text-gray-900 text-sm tracking-tight">NanoLab</span>
        <span class="text-xs text-indigo-500 font-semibold tracking-wide">Scientist</span>
      </div>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-5">
      <p class="text-xs text-gray-500" x-text="clock.date + ' · ' + clock.time"></p>
      <div class="w-px h-7 bg-gray-100"></div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p class="text-sm font-medium text-gray-800 leading-tight">dr A. Kowalska</p>
          <p class="text-xs text-gray-400 leading-tight">University Research Lab</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-indigo-100 border-2 border-indigo-200 flex items-center justify-center text-indigo-700 font-bold text-xs shrink-0">
          AK
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-52 bg-white border-r border-gray-200 flex flex-col shrink-0 overflow-y-auto">
      <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5">

        <a href="index.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
          </svg>
          Overview
        </a>

        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 pt-4 pb-1">Research</p>

        <a href="experiments.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8" />
          </svg>
          Experiments
        </a>

        <a href="inventory.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
          </svg>
          Inventory
        </a>

        <a href="queued-samples.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" />
          </svg>
          Queued Samples
          <span class="ml-auto text-xs bg-indigo-100 text-indigo-500 font-medium px-1.5 py-0.5 rounded-md"
                x-text="totalPending"></span>
        </a>

      </nav>

      <div class="p-3 border-t border-gray-100">
        <a href="../operator/tem.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
          <span class="text-teal-700 font-medium">Operator App</span>
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 overflow-y-auto px-8 py-7">

      <!-- Page header -->
      <div class="mb-7 flex items-center gap-3">
        <div class="w-1 h-8 bg-indigo-600 rounded-full"></div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">Queued Samples</h1>
          <p class="text-xs text-gray-400 mt-0.5">Status of your samples across all instruments</p>
        </div>
      </div>

      <!-- Summary strip -->
      <div class="flex items-center gap-6 mb-7 px-1">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
          <span class="text-sm text-gray-700"><span class="font-semibold" x-text="totalPending"></span> queued</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
          <span class="text-sm text-gray-700"><span class="font-semibold" x-text="totalScheduled"></span> scheduled</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="text-sm text-gray-700"><span class="font-semibold" x-text="totalCompleted"></span> completed</span>
        </div>
      </div>

      <!-- Instrument cards grid -->
      <div class="grid grid-cols-2 gap-5">
        <template x-for="inst in instruments" :key="inst.id">

          <div class="bg-white rounded-xl border border-gray-200 overflow-hidden flex flex-col"
               :class="{
                 'border-l-4 border-l-blue-400':    !inst.comingSoon && pendingCount(inst) > 0,
                 'border-l-4 border-l-emerald-400': !inst.comingSoon && pendingCount(inst) === 0 && inst.samples.length > 0,
                 'border-l-4 border-l-gray-200':    inst.comingSoon || inst.samples.length === 0,
                 'opacity-60':                      inst.comingSoon
               }">

            <!-- Card header -->
            <div class="px-5 py-4 border-b border-gray-100 flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="font-semibold text-gray-900 text-sm leading-tight" x-text="inst.name"></p>
                <p class="text-xs text-gray-400 mt-0.5" x-text="inst.technique"></p>
                <div class="flex items-center gap-1.5 mt-2">
                  <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                  </svg>
                  <p class="text-xs text-gray-500" x-text="inst.operator"></p>
                </div>
              </div>

              <!-- Status summary chips -->
              <div class="flex flex-col items-end gap-1 shrink-0">
                <span x-show="inst.comingSoon"
                      class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">
                  Coming soon
                </span>
                <template x-if="!inst.comingSoon">
                  <template x-if="pendingCount(inst) > 0">
                    <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">
                      <span x-text="pendingCount(inst)"></span> queued
                    </span>
                  </template>
                </template>
                <template x-if="!inst.comingSoon">
                  <template x-if="scheduledCount(inst) > 0">
                    <span class="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">
                      <span x-text="scheduledCount(inst)"></span> scheduled
                    </span>
                  </template>
                </template>
                <template x-if="!inst.comingSoon">
                  <template x-if="completedCount(inst) > 0">
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">
                      <span x-text="completedCount(inst)"></span> done
                    </span>
                  </template>
                </template>
                <span x-show="!inst.comingSoon && inst.samples.length === 0"
                      class="text-xs text-gray-400">No samples</span>
              </div>
            </div>

            <!-- Coming soon state -->
            <div x-show="inst.comingSoon"
                 class="px-5 py-6 text-center flex-1 flex items-center justify-center">
              <p class="text-xs text-gray-400">Not yet integrated with lab systems</p>
            </div>

            <!-- Sample list -->
            <div x-show="!inst.comingSoon && inst.samples.length > 0" class="divide-y divide-gray-50 flex-1">
              <template x-for="s in inst.samples" :key="s.exp_id + inst.id">
                <div class="px-5 py-2.5 flex items-center gap-3">
                  <span class="font-mono text-xs text-gray-400 shrink-0 w-28" x-text="s.exp_id"></span>
                  <span class="text-xs text-gray-400 shrink-0 w-32 truncate" x-text="s.scientist"></span>
                  <span class="text-sm text-gray-700 flex-1 truncate" x-text="s.material"></span>
                  <span class="text-xs text-gray-400 shrink-0" x-text="formatDate(s.submitted)"></span>
                  <span class="text-xs font-medium shrink-0 tabular-nums w-10 text-right"
                        :class="daysColor(s.status)"
                        x-text="daysDuration(s)"></span>
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium shrink-0"
                        :class="sampleBadge(s.status).class">
                    <span class="w-1.5 h-1.5 rounded-full" :class="sampleBadge(s.status).dot"></span>
                    <span x-text="sampleBadge(s.status).label"></span>
                  </span>
                </div>
              </template>
            </div>

            <!-- Empty state (real instrument, no samples yet) -->
            <div x-show="!inst.comingSoon && inst.samples.length === 0"
                 class="px-5 py-6 text-center flex-1 flex items-center justify-center">
              <p class="text-xs text-gray-400">No samples submitted to this instrument</p>
            </div>

          </div>

        </template>
      </div>

    </main>
  </div>

  <script>
    function app() {
      return {
        clock: { date: '', time: '' },

        async init() {
          const update = () => {
            const now = new Date()
            this.clock.date = now.toLocaleDateString('en-GB', { timeZone: 'Europe/Warsaw', day: 'numeric', month: 'short', year: 'numeric' })
            this.clock.time = now.toLocaleTimeString('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', second: '2-digit' })
          }
          update()
          setInterval(update, 1000)

          const res = await fetch('/api/tem/requests')
          const requests = await res.json()
          const tem = this.instruments.find(i => i.id === 'tem')
          tem.samples = requests.map(r => ({
            exp_id: r.exp_id,
            scientist: r.scientist,
            material: r.material,
            submitted: r.submitted,
            completed_date: r.archive?.archived_at || null,
            status: this.columnToStatus(r.column),
          }))
        },

        columnToStatus(column) {
          if (column === 'archived') return 'completed'
          if (column === 'prep' || column === 'imaging') return 'scheduled'
          return 'pending'
        },

        instruments: [
          {
            id: 'tem',
            name: 'TEM · JEOL JEM-1400',
            technique: 'Transmission Electron Microscopy',
            operator: 'mgr J. Nowak',
            comingSoon: false,
            samples: []
          },
          {
            id: 'xrd',
            name: 'XRD · PANalytical EMPYREAN',
            technique: 'Powder X-ray Diffraction',
            operator: 'dr M. Kowalczyk',
            comingSoon: true,
            samples: []
          },
          {
            id: 'dls',
            name: 'DLS · Malvern Zetasizer Nano ZS',
            technique: 'Dynamic Light Scattering / Zeta Potential',
            operator: 'dr D. Wiśniewska',
            comingSoon: true,
            samples: []
          },
          {
            id: 'squid',
            name: 'SQUID · Quantum Design MPMS',
            technique: 'DC/AC Magnetometry (±7 T, 1.9–800 K)',
            operator: 'dr hab. O. Kowalenko',
            comingSoon: true,
            samples: []
          },
          {
            id: 'sem',
            name: 'SEM · JEOL JSM-7001TTLS',
            technique: 'Scanning Electron Microscopy / EDS',
            operator: 'mgr J. Nowak',
            comingSoon: true,
            samples: []
          },
          {
            id: 'ftir',
            name: 'FTIR · Nicolet iS50',
            technique: 'Fourier Transform Infrared Spectroscopy',
            operator: 'dr A. Kowalska',
            comingSoon: true,
            samples: []
          },
        ],

        get totalPending() {
          return this.instruments.reduce((n, i) => n + i.samples.filter(s => s.status === 'pending').length, 0)
        },
        get totalScheduled() {
          return this.instruments.reduce((n, i) => n + i.samples.filter(s => s.status === 'scheduled').length, 0)
        },
        get totalCompleted() {
          return this.instruments.reduce((n, i) => n + i.samples.filter(s => s.status === 'completed').length, 0)
        },

        pendingCount(inst)   { return inst.samples.filter(s => s.status === 'pending').length },
        scheduledCount(inst) { return inst.samples.filter(s => s.status === 'scheduled').length },
        completedCount(inst) { return inst.samples.filter(s => s.status === 'completed').length },

        formatDate(str) {
          return new Date(str).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
        },

        daysDuration(s) {
          const start = new Date(s.submitted)
          const end = s.completed_date ? new Date(s.completed_date) : new Date()
          const days = Math.round((end - start) / 86400000)
          return days === 1 ? '1 d' : `${days} d`
        },

        daysColor(status) {
          return {
            pending:   'text-blue-500',
            scheduled: 'text-amber-500',
            completed: 'text-emerald-600',
          }[status] || 'text-gray-400'
        },

        sampleBadge(status) {
          return {
            pending:   { label: 'Queued',    dot: 'bg-blue-500',    class: 'bg-blue-100 text-blue-800'    },
            scheduled: { label: 'Scheduled', dot: 'bg-amber-500',   class: 'bg-amber-100 text-amber-800'  },
            completed: { label: 'Done',      dot: 'bg-emerald-500', class: 'bg-emerald-100 text-emerald-800' },
          }[status] || { label: status, dot: 'bg-gray-400', class: 'bg-gray-100 text-gray-600' }
        },
      }
    }
  </script>

</body>
</html>
