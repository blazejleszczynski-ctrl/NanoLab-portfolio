<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NanoLab — Experiments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 600: '#4F46E5', 700: '#4338CA', 50: '#EEF2FF', 100: '#E0E7FF' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="experimentsApp()">

  <!-- Top navigation -->
  <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-14">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8M5 14.5H3m16.8 1.3H21M9 20.5h6" />
          </svg>
        </div>
        <span class="font-semibold text-gray-900 tracking-tight">NanoLab</span>
        <span class="text-xs text-gray-400 font-medium ml-1">Scientist</span>
      </div>

      <!-- Nav links -->
      <div class="flex items-center gap-1">
        <a href="experiments.html"
           class="px-4 py-1.5 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700 border border-indigo-100">
          Experiments
        </a>
        <a href="inventory.html"
           class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          Inventory
        </a>
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">dr A. Kowalska</span>
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-semibold text-sm">
          PF
        </div>
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Page header -->
    <div class="flex items-start justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Experiments</h1>
        <p class="text-sm text-gray-500 mt-0.5">University Research Lab · 2026</p>
      </div>
      <a href="new-experiment.html"
         class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        New Experiment
      </a>
    </div>

    <!-- Stats row -->
    <div class="grid grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Total</p>
        <p class="text-2xl font-bold text-gray-900" x-text="experiments.length"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">In Progress</p>
        <p class="text-2xl font-bold text-sky-600" x-text="experiments.filter(e => ['in_synthesis','in_characterization','planned'].includes(e.status)).length"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Completed</p>
        <p class="text-2xl font-bold text-green-600" x-text="experiments.filter(e => e.status === 'completed').length"></p>
      </div>
      <div class="bg-white rounded-xl border border-gray-200 px-5 py-4">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Drafts</p>
        <p class="text-2xl font-bold text-gray-400" x-text="experiments.filter(e => e.status === 'draft').length"></p>
      </div>
    </div>

    <!-- Filters + search -->
    <div class="flex items-center gap-3 mb-4">
      <div class="relative flex-1 max-w-sm">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <input type="text" placeholder="Search experiments..."
               class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
               x-model="search" />
      </div>

      <div class="flex items-center gap-2">
        <template x-for="f in statusFilters" :key="f.value">
          <button @click="toggleFilter(f.value)"
                  :class="activeFilters.includes(f.value) ? f.activeClass : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'"
                  class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors"
                  x-text="f.label">
          </button>
        </template>
        <button @click="activeFilters = []" x-show="activeFilters.length > 0"
                class="px-3 py-1.5 text-xs text-gray-400 hover:text-gray-600 transition-colors">
          Clear
        </button>
      </div>
    </div>

    <!-- Experiments table -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-gray-100 bg-gray-50/50">
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide w-32">ID</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Material</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Method</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide w-32">Date</th>
            <th class="text-left px-5 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide w-40">Status</th>
            <th class="px-5 py-3 w-20"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="exp in filteredExperiments" :key="exp.experiment_id">
            <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors cursor-pointer"
                @click="openExperiment(exp)">
              <td class="px-5 py-3.5">
                <span class="font-mono text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded"
                      x-text="exp.experiment_id"></span>
              </td>
              <td class="px-5 py-3.5">
                <div class="font-medium text-gray-900" x-text="exp.target_material"></div>
                <div class="text-xs text-gray-400 mt-0.5" x-text="exp.notes_short"></div>
              </td>
              <td class="px-5 py-3.5 text-gray-600" x-text="exp.synthesis_method"></td>
              <td class="px-5 py-3.5 text-gray-500 text-xs" x-text="exp.date_started"></td>
              <td class="px-5 py-3.5">
                <span :class="statusBadge(exp.status).class"
                      class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium">
                  <span :class="statusBadge(exp.status).dot" class="w-1.5 h-1.5 rounded-full"></span>
                  <span x-text="statusBadge(exp.status).label"></span>
                </span>
              </td>
              <td class="px-5 py-3.5 text-right">
                <button class="text-gray-400 hover:text-indigo-600 transition-colors" @click.stop="openExperiment(exp)">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                  </svg>
                </button>
              </td>
            </tr>
          </template>

          <!-- Empty state -->
          <tr x-show="filteredExperiments.length === 0">
            <td colspan="6" class="px-5 py-16 text-center text-gray-400">
              <svg class="w-10 h-10 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8" />
              </svg>
              <p class="text-sm font-medium text-gray-500">No experiments found</p>
              <p class="text-xs text-gray-400 mt-1">Try adjusting your filters or create a new experiment.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Row count -->
    <p class="text-xs text-gray-400 mt-3 px-1"
       x-text="`Showing ${filteredExperiments.length} of ${experiments.length} experiments`"></p>

  </main>

  <script>
    function experimentsApp() {
      return {
        search: '',
        activeFilters: [],

        statusFilters: [
          { value: 'draft',              label: 'Draft',               activeClass: 'bg-gray-100 text-gray-700 border-gray-300' },
          { value: 'planned',            label: 'Planned',             activeClass: 'bg-sky-50 text-sky-700 border-sky-200' },
          { value: 'in_synthesis',       label: 'In Synthesis',        activeClass: 'bg-amber-50 text-amber-700 border-amber-200' },
          { value: 'in_characterization',label: 'In Characterization', activeClass: 'bg-sky-50 text-sky-700 border-sky-200' },
          { value: 'completed',          label: 'Completed',           activeClass: 'bg-green-50 text-green-700 border-green-200' },
        ],

        experiments: [
          {
            experiment_id: 'EXP-2026-001',
            target_material: 'Fe₃O₄',
            notes_short: 'Co-precipitation · NaOH · 80°C',
            synthesis_method: 'Co-precipitation',
            date_started: '2026-05-14',
            status: 'completed',
            experiment_type: 'synthesis'
          },
          {
            experiment_id: 'EXP-2026-002',
            target_material: 'Fe₃O₄',
            notes_short: 'Co-precipitation · sodium citrate mod.',
            synthesis_method: 'Co-precipitation',
            date_started: '2026-05-28',
            status: 'in_characterization',
            experiment_type: 'synthesis'
          },
          {
            experiment_id: 'EXP-2026-003',
            target_material: 'Fe(oleate)₃',
            notes_short: 'Precursor for thermal decomp. series',
            synthesis_method: 'Precursor synthesis',
            date_started: '2026-06-02',
            status: 'completed',
            experiment_type: 'precursor_synthesis'
          },
          {
            experiment_id: 'EXP-2026-004',
            target_material: 'Fe₃O₄',
            notes_short: 'Thermal decomp. · ODE · TOA stabilizer · 300°C',
            synthesis_method: 'Thermal decomposition',
            date_started: '2026-06-05',
            status: 'in_synthesis',
            experiment_type: 'synthesis'
          },
          {
            experiment_id: 'EXP-2026-005',
            target_material: 'Fe₃O₄',
            notes_short: 'Thermal decomp. · ODE · OAm stabilizer · 325°C',
            synthesis_method: 'Thermal decomposition',
            date_started: '2026-06-10',
            status: 'planned',
            experiment_type: 'synthesis'
          },
          {
            experiment_id: 'EXP-2026-006',
            target_material: 'ZnO',
            notes_short: 'Sol-gel · ethanol · room temp.',
            synthesis_method: 'Sol-gel',
            date_started: '2026-06-12',
            status: 'draft',
            experiment_type: 'synthesis'
          },
        ],

        get filteredExperiments() {
          return this.experiments.filter(exp => {
            const matchSearch = this.search === '' ||
              exp.experiment_id.toLowerCase().includes(this.search.toLowerCase()) ||
              exp.target_material.toLowerCase().includes(this.search.toLowerCase()) ||
              exp.synthesis_method.toLowerCase().includes(this.search.toLowerCase()) ||
              exp.notes_short.toLowerCase().includes(this.search.toLowerCase())

            const matchFilter = this.activeFilters.length === 0 ||
              this.activeFilters.includes(exp.status)

            return matchSearch && matchFilter
          })
        },

        toggleFilter(value) {
          if (this.activeFilters.includes(value)) {
            this.activeFilters = this.activeFilters.filter(f => f !== value)
          } else {
            this.activeFilters.push(value)
          }
        },

        statusBadge(status) {
          const map = {
            draft:               { label: 'Draft',               dot: 'bg-gray-400',  class: 'bg-gray-100 text-gray-600' },
            planned:             { label: 'Planned',             dot: 'bg-sky-400',   class: 'bg-sky-50 text-sky-700' },
            in_synthesis:        { label: 'In Synthesis',        dot: 'bg-amber-400', class: 'bg-amber-50 text-amber-700' },
            in_characterization: { label: 'In Characterization', dot: 'bg-sky-400',   class: 'bg-sky-50 text-sky-700' },
            completed:           { label: 'Completed',           dot: 'bg-green-500', class: 'bg-green-50 text-green-700' },
          }
          return map[status] || map['draft']
        },

        openExperiment(exp) {
          // placeholder — will navigate to experiment detail view
          alert(`Opening ${exp.experiment_id}: ${exp.target_material}`)
        }
      }
    }
  </script>

</body>
</html>
