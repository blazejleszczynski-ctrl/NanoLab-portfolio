<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NanoLab — Experiments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden" x-data="app()">

  <!-- TOPBAR -->
  <header class="h-14 bg-white border-t-[3px] border-t-indigo-600 border-b border-b-gray-200 flex items-center px-5 shrink-0 z-10">
    <div class="flex items-center gap-2.5 w-52 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8" />
        </svg>
      </div>
      <div class="flex items-baseline gap-1.5">
        <span class="font-bold text-gray-900 text-sm tracking-tight">NanoLab</span>
        <span class="text-xs text-indigo-500 font-semibold tracking-wide">Scientist</span>
      </div>
    </div>
    <div class="flex-1"></div>
    <div class="flex items-center gap-5">
      <p class="text-xs text-gray-500"
         x-text="clock.date + ' · ' + clock.time"></p>
      <div class="w-px h-7 bg-gray-100"></div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <p class="text-sm font-medium text-gray-800 leading-tight">dr A. Kowalska</p>
          <p class="text-xs text-gray-400 leading-tight">University Research Lab</p>
        </div>
        <div class="w-8 h-8 rounded-full bg-indigo-100 border-2 border-indigo-200 flex items-center justify-center text-indigo-700 font-bold text-xs shrink-0">
          PF
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-52 bg-white border-r border-gray-200 flex flex-col shrink-0 overflow-y-auto">
      <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5">

        <a href="index.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
          </svg>
          Overview
        </a>

        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 pt-4 pb-1">Research</p>

        <a href="experiments.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.8 1.8M5 14.5l1.8 1.8" />
          </svg>
          Experiments
          <span class="ml-auto text-xs bg-indigo-100 text-indigo-500 font-medium px-1.5 py-0.5 rounded-md"
                x-text="experiments.length"></span>
        </a>

        <a href="inventory.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
          </svg>
          Inventory
        </a>

      </nav>

      <div class="p-3 border-t border-gray-100">
        <a href="../operator-app/tem.html"
           class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="w-4 h-4 shrink-0 text-teal-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
          <span class="text-teal-700 font-medium">Operator App</span>
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto px-8 py-7">

      <!-- Page header -->
      <div class="flex items-center justify-between mb-7">
        <div>
          <h1 class="text-xl font-bold text-gray-900">Experiments</h1>
          <p class="text-sm text-gray-400 mt-0.5" x-text="`${experiments.length} total`"></p>
        </div>
        <a href="new-experiment.html"
           class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          New Experiment
        </a>
      </div>

      <!-- Filters + search -->
      <div class="flex items-center gap-3 mb-4">
        <div class="relative flex-1 max-w-xs">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
          <input type="text" placeholder="Search..."
                 class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                 x-model="search" />
        </div>

        <div class="flex items-center gap-2">
          <template x-for="f in statusFilters" :key="f.value">
            <button @click="toggleFilter(f.value)"
                    :class="activeFilters.includes(f.value) ? f.activeClass : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'"
                    class="px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors"
                    x-text="f.label">
            </button>
          </template>
          <button @click="activeFilters = []" x-show="activeFilters.length > 0"
                  class="text-xs text-gray-400 hover:text-gray-600 px-2">
            Clear
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-100 bg-gray-50/60">
              <th class="text-right px-4 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wide w-44">Status</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wide w-36">ID</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wide">Material</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wide">Method</th>
              <th class="text-left px-5 py-3 text-xs font-semibold text-gray-400 uppercase tracking-wide w-32">Date</th>
              <th class="px-5 py-3 w-10"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="exp in filteredExperiments" :key="exp.experiment_id">
              <tr class="border-b border-gray-50 last:border-0 hover:bg-gray-50/50 transition-colors cursor-pointer">
                <!-- Status — prawostronny, kropka PO PRAWEJ od tekstu -->
                <td class="px-4 py-3.5 text-right">
                  <span :class="statusBadge(exp.status).class"
                        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium">
                    <span x-text="statusBadge(exp.status).label"></span>
                    <span :class="statusBadge(exp.status).dot" class="w-1.5 h-1.5 rounded-full shrink-0"></span>
                  </span>
                </td>
                <!-- ID — lewostronny, mono, wyciszony -->
                <td class="px-4 py-3.5">
                  <span class="font-mono text-xs text-gray-400" x-text="exp.experiment_id"></span>
                </td>
                <td class="px-5 py-3.5">
                  <div class="font-medium text-gray-900" x-text="exp.target_material"></div>
                  <div class="text-xs text-gray-400 mt-0.5" x-text="exp.notes_short"></div>
                </td>
                <td class="px-5 py-3.5 text-gray-500" x-text="exp.synthesis_method"></td>
                <td class="px-5 py-3.5 text-xs text-gray-400" x-text="exp.date_started"></td>
                <td class="px-5 py-3.5 text-right">
                  <svg class="w-4 h-4 text-gray-300 hover:text-indigo-500 transition-colors ml-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                  </svg>
                </td>
              </tr>
            </template>

            <tr x-show="filteredExperiments.length === 0">
              <td colspan="6" class="px-5 py-14 text-center">
                <p class="text-sm text-gray-400">No experiments match your filters.</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <p class="text-xs text-gray-400 mt-3"
         x-text="`${filteredExperiments.length} of ${experiments.length} experiments`"></p>

    </main>
  </div>

  <script>
    function app() {
      return {
        search: '',
        activeFilters: [],
        clock: { date: '', time: '' },

        init() {
          const update = () => {
            const now = new Date()
            this.clock.date = now.toLocaleDateString('en-GB', { timeZone: 'Europe/Warsaw', day: 'numeric', month: 'short', year: 'numeric' })
            this.clock.time = now.toLocaleTimeString('en-GB', { timeZone: 'Europe/Warsaw', hour: '2-digit', minute: '2-digit', second: '2-digit' })
          }
          update()
          setInterval(update, 1000)
        },

        statusFilters: [
          { value: 'draft',               label: 'Draft',               activeClass: 'bg-slate-100 text-slate-700 border-slate-300' },
          { value: 'planned',             label: 'Planned',             activeClass: 'bg-blue-100 text-blue-800 border-blue-300' },
          { value: 'in_synthesis',        label: 'On Going',            activeClass: 'bg-amber-100 text-amber-800 border-amber-300' },
          { value: 'in_characterization', label: 'In Characterization', activeClass: 'bg-violet-100 text-violet-800 border-violet-300' },
          { value: 'completed',           label: 'Completed',           activeClass: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        ],

        experiments: [
          { experiment_id: 'EXP-2026-001', target_material: 'Fe₃O₄', notes_short: 'Co-precipitation · NaOH · 80°C', synthesis_method: 'Co-precipitation',    date_started: '2026-05-14', status: 'completed' },
          { experiment_id: 'EXP-2026-002', target_material: 'Fe₃O₄', notes_short: 'Sodium citrate modifier',        synthesis_method: 'Co-precipitation',    date_started: '2026-05-28', status: 'in_characterization' },
          { experiment_id: 'EXP-2026-003', target_material: 'Fe(oleate)₃', notes_short: 'Precursor for TD series', synthesis_method: 'Precursor synthesis',  date_started: '2026-06-02', status: 'completed' },
          { experiment_id: 'EXP-2026-004', target_material: 'Fe₃O₄', notes_short: 'TOA stabilizer · 300°C · ODE',  synthesis_method: 'Thermal decomposition', date_started: '2026-06-05', status: 'in_synthesis' },
          { experiment_id: 'EXP-2026-005', target_material: 'Fe₃O₄', notes_short: 'OAm stabilizer · 325°C · ODE',  synthesis_method: 'Thermal decomposition', date_started: '2026-06-10', status: 'planned' },
          { experiment_id: 'EXP-2026-006', target_material: 'ZnO',   notes_short: 'Sol-gel · ethanol · RT',         synthesis_method: 'Sol-gel',               date_started: '2026-06-12', status: 'draft' },
        ],

        get filteredExperiments() {
          return this.experiments.filter(exp => {
            const q = this.search.toLowerCase()
            const matchSearch = q === '' ||
              exp.experiment_id.toLowerCase().includes(q) ||
              exp.target_material.toLowerCase().includes(q) ||
              exp.synthesis_method.toLowerCase().includes(q) ||
              (exp.notes_short || '').toLowerCase().includes(q)
            const matchFilter = this.activeFilters.length === 0 || this.activeFilters.includes(exp.status)
            return matchSearch && matchFilter
          })
        },

        toggleFilter(value) {
          if (this.activeFilters.includes(value)) {
            this.activeFilters = this.activeFilters.filter(f => f !== value)
          } else {
            this.activeFilters.push(value)
          }
        },

        statusBadge(status) {
          const map = {
            draft:               { label: 'Draft',               dot: 'bg-slate-400',   class: 'bg-slate-100 text-slate-600' },
            planned:             { label: 'Planned',             dot: 'bg-blue-500',    class: 'bg-blue-100 text-blue-800' },
            in_synthesis:        { label: 'On Going',            dot: 'bg-amber-500',   class: 'bg-amber-100 text-amber-800' },
            in_characterization: { label: 'In Characterization', dot: 'bg-violet-500',  class: 'bg-violet-100 text-violet-800' },
            completed:           { label: 'Completed',           dot: 'bg-emerald-500', class: 'bg-emerald-100 text-emerald-800' },
          }
          return map[status] || map['draft']
        }
      }
    }
  </script>

</body>
</html>
